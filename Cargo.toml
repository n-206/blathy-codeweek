[package]
name = "codeweek"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
aes-gcm = "0.10"
base64 = "0.23.1"
flate2 = "1"
hkdf = "0.13.0"
getrandom = "0.3"
p256 = { version = "0.14.0", features = ["ecdh", "ecdsa", "pem"] }
rand_core = "0.10.1"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
