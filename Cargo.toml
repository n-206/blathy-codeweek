[package]
name = "codeweek"
version = "0.1.0"
edition = "2024"

[dependencies]

# Cryptography
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc"] }
hkdf = "0.13.0"
p256 = { version = "0.14.0", features = ["ecdh", "ecdsa", "pem"] }
sha2 = "0.11.1"

# HTTP
reqwest = { version = "0.13.5", features = ["json"] }

# Serialization and encoding
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Compression
flate2 = "1"

# Errors and async runtime
anyhow = "1.0.104"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
